<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Briefing — livia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* =====================================================
     DESIGN TOKENS — 8pt grid
     Base unit: 8px
     Scale: 4 8 12 16 24 32 40 48 56 64
  ===================================================== */
  :root{
    --primary:#2a2a2a; --neutral-200:#e7e7e7; --neutral-900:#2a2a2a;
    --paper:#f8fbfa; --white:#ffffff;
    --ease-out:cubic-bezier(.22,.9,.32,1); --ease-spring:cubic-bezier(.34,1.4,.64,1);
    --sidebar-w:min(300px, 88vw); /* BUG FIX: never wider than viewport on small screens */
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; font-family:'Inter',system-ui,sans-serif; background:var(--paper); color:var(--neutral-900); -webkit-font-smoothing:antialiased; }
  button{ font-family:inherit; cursor:pointer; }

  /* ====== ROOT LAYOUT ====== */
  .shell{ display:flex; height:100vh; overflow:hidden; }

  /* ── Sidebar: overlay on mobile, push on desktop ── */
  .sidebar{
    /* Mobile-first: always overlay */
    position:fixed; top:0; right:0; z-index:50;
    width:var(--sidebar-w); height:100vh;
    background:var(--white);
    border-left:1px solid var(--neutral-200);
    display:flex; flex-direction:column; overflow:hidden;
    transform:translateX(100%);
    transition:transform .35s var(--ease-out);
    box-shadow:-16px 0 40px rgba(0,0,0,.18);
  }
  .sidebar.open{ transform:translateX(0); }

  /* Desktop (≥641px): push layout instead of overlay */
  @media(min-width:641px){
    .sidebar{
      position:relative; top:auto; right:auto; z-index:auto;
      flex-shrink:0; height:100vh;
      transform:none;
      margin-right:calc(-1 * var(--sidebar-w));
      transition:margin-right .35s var(--ease-out);
      box-shadow:none;
    }
    .sidebar.open{ transform:none; margin-right:0; }
  }

  /* Backdrop — visible on mobile only */
  .mob-backdrop{
    display:none; position:fixed; inset:0;
    background:rgba(0,0,0,.3); z-index:45;
    opacity:0; pointer-events:none; transition:opacity .25s;
  }
  @media(max-width:640px){
    .mob-backdrop{ display:block; }
  }
  .mob-backdrop.show{ opacity:1; pointer-events:auto; }

  .main{ flex:1; display:flex; flex-direction:column; height:100vh; overflow:hidden; min-width:0; }

  /* ====== TABS — height snapped to 48px (6×8) ====== */
  .tabs{ display:flex; align-items:center; background:var(--white); border-bottom:1px solid var(--neutral-200); padding:0 16px; height:48px; flex-shrink:0; gap:4px; }
  .tab{ padding:0 4px; height:100%; margin-right:16px; font-size:13px; font-weight:500; color:#999; background:none; border:none; position:relative; transition:color .2s; white-space:nowrap; min-height:44px; /* touch target */ }
  .tab:hover{ color:var(--neutral-900); }
  .tab.active{ color:var(--primary); }
  .tab.active::after{ content:''; position:absolute; bottom:-1px; left:0; right:0; height:2px; background:var(--primary); border-radius:2px 2px 0 0; }
  .badge{ background:rgba(42,42,42,.1); color:var(--primary); font-size:10px; font-weight:600; padding:2px 6px; border-radius:999px; margin-left:4px; }
  .tabs-spacer{ flex:1; }
  .tabs-meta{ font-size:11px; color:#aaa; text-transform:uppercase; letter-spacing:.1em; display:flex; align-items:center; gap:8px; }
  @media(max-width:480px){ .tabs-meta span:last-child{ display:none; } }
  .live-dot-green{ width:6px; height:6px; border-radius:50%; background:#7482ae; box-shadow:0 0 0 3px rgba(76,175,80,.15); animation:pulse 2s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.5} }
  .main-content{ flex:1; overflow:hidden; position:relative; }

  /* ====== INTRO ====== */
  .intro{ background:radial-gradient(ellipse at 30% 0%,#3a3a3a 0%,#2a2a2a 55%,#1f1f1f 100%); color:var(--paper); height:100%; display:flex; flex-direction:column; overflow-y:auto; position:relative; }
  .intro::before{ content:''; position:absolute; inset:0; background:linear-gradient(180deg,rgba(42,42,42,.55) 0%,rgba(42,42,42,.35) 35%,rgba(20,20,20,.78) 100%); pointer-events:none; }
  .intro>*{ position:relative; z-index:1; }

  /* 8pt: padding 16px vertical, clamp horizontal 16→56 */
  .home-nav{ display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; padding:16px clamp(16px,4vw,56px); border-bottom:1px solid rgba(248,251,250,.12); flex-shrink:0; }
  .home-nav-links{ display:flex; align-items:center; gap:clamp(16px,3vw,32px); }
  .home-nav-link{ background:none; border:none; font-size:13px; font-weight:500; color:rgba(248,251,250,.75); transition:color .2s; padding:8px 0; /* 8pt touch area */ }
  .home-nav-link:hover{ color:var(--paper); }
  @media(max-width:480px){ .home-nav-links{ display:none; } }

  .home-nav-right{ display:inline-flex; align-items:center; gap:8px; }
  /* BUG FIX: min touch target 44px */
  .eye-btn-dark{ width:40px; height:40px; border-radius:50%; border:1px solid rgba(248,251,250,.22); background:rgba(255,255,255,.08); color:var(--paper); display:inline-flex; align-items:center; justify-content:center; transition:transform .2s,background .2s; flex-shrink:0; }
  .eye-btn-dark:hover{ background:rgba(255,255,255,.16); transform:translateY(-1px); }
  .eye-btn-dark.active{ background:rgba(255,255,255,.2); border-color:rgba(248,251,250,.5); }
  .home-nav-cta{ background:var(--paper); color:var(--primary); border:none; padding:8px 16px; border-radius:999px; font-size:13px; font-weight:600; display:inline-flex; align-items:center; gap:8px; transition:all .2s; white-space:nowrap; min-height:40px; }
  .home-nav-cta:hover{ transform:translateY(-1px); box-shadow:0 8px 20px rgba(0,0,0,.22); }

  /* hero padding: 24px → 56px horizontal, 24px → 56px vertical — all 8pt multiples */
  .home-hero{ flex:1; display:flex; align-items:center; justify-content:flex-start; padding:clamp(24px,4vw,56px) clamp(16px,4vw,64px); }
  .hero-card{ background:rgba(255,255,255,.07); border:1px solid rgba(248,251,250,.16); border-radius:16px; padding:clamp(24px,4vw,48px); max-width:520px; width:100%; backdrop-filter:blur(18px); box-shadow:0 24px 56px rgba(0,0,0,.28); animation:introIn .9s var(--ease-out); }
  @keyframes introIn{ from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }

  .eyebrow{ font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.22em; color:#7080b0; margin-bottom:24px; display:inline-flex; align-items:center; gap:8px; }
  .eyebrow::before{ content:''; width:24px; height:1px; background:#7080b0; }
  .eyebrow::before{ content:''; width:24px; height:1px; background:rgba(248,251,250,.55); }
  .live-dot-warm{ width:6px; height:6px; border-radius:50%; background:#7080b0; box-shadow:0 0 0 4px rgba(112,128,176,.22); }
  .headline-block{ display:inline-block; width:100%; }
  .headline{ font-size:clamp(32px,5.2vw,64px); font-weight:600; letter-spacing:-.035em; line-height:.98; color:var(--paper); margin-bottom:24px; text-shadow:0 4px 24px rgba(0,0,0,.18); }
  .headline em{ font-style:normal; background:linear-gradient(transparent 62%,rgba(248,251,250,.22) 62%); padding:0 4px; }
  /* 8pt: 36→32 */
  .sub{ font-size:clamp(15px,1.4vw,17px); color:rgba(248,251,250,.78); line-height:1.65; margin-bottom:32px; }
  .br-desk{ display:none; }
  @media(min-width:641px){ .br-desk{ display:block; } }
  .sub-strong{ font-weight:700; color:var(--paper); }
  .home-nav-logo{ display:flex; align-items:center; }
  .cta-row{ display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .cta-meta{ font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.22em; color:#7080b0; display:inline-flex; align-items:center; gap:8px; }
  /* 8pt: padding 16px 24px */
  .intro-cta{ background:var(--paper); color:var(--primary); border:none; padding:16px 28px; border-radius:999px; font-size:15px; font-weight:600; display:inline-flex; align-items:center; gap:12px; transition:all .25s var(--ease-spring); box-shadow:0 12px 32px rgba(0,0,0,.25); min-height:48px; }
  .intro-cta:hover{ background:#7080b0; color:var(--paper); transform:translateY(-2px) scale(1.02); box-shadow:0 8px 16px rgba(112,128,176,.2); }
  .arr{ background:var(--neutral-200); color:var(--primary); padding:4px 8px; border-radius:4px; font-size:12px; }

  /* 8pt: padding 16px */
  .home-foot{ padding:16px clamp(16px,4vw,56px); border-top:1px solid rgba(248,251,250,.1); display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; font-size:11px; color:rgba(248,251,250,.5); }
  .home-foot a{ color:rgba(248,251,250,.65); text-decoration:none; }
  .foot-msg-btn{ font-size:11px; font-weight:500; color:rgba(248,251,250,.55); background:none; border:none; border-bottom:1px solid rgba(248,251,250,.3); padding-bottom:1px; cursor:pointer; transition:color .2s,border-color .2s; letter-spacing:.02em; text-decoration:none; }
  .foot-msg-btn:hover{ color:rgba(248,251,250,.85); border-bottom-color:rgba(248,251,250,.6); }
  .home-foot .dot{ width:3px; height:3px; border-radius:50%; background:rgba(248,251,250,.3); display:inline-block; }
  @media(max-width:480px){ .foot-right{ display:none; } }

  /* ====== FORM ====== */
  .form-stage{ display:flex; flex-direction:column; height:100%; background:linear-gradient(135deg,#2a2a2a 0%,#1f1f1f 100%); overflow:hidden; }
  .progress-bar{ height:3px; background:rgba(0,0,0,.2); flex-shrink:0; }
  .progress-fill{ height:100%; background:#7080b0; transition:width .5s var(--ease-out); }
  /* 8pt: padding 16→32 vertical, 16→80 horizontal */
  .question-area{ flex:1; display:flex; align-items:center; justify-content:center; padding:clamp(16px,3vw,32px) clamp(16px,5vw,80px); overflow-y:auto; }
  .question-frame{ width:100%; max-width:660px; }
  .question{ animation:slideIn .5s var(--ease-out); }
  @keyframes slideIn{ from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:translateY(0)} }

  /* 8pt: gap 8, margin-bottom 16 */
  .q-meta{ display:flex; align-items:center; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  .q-section-badge{ display:inline-flex; align-items:center; gap:8px; background:rgba(255,255,255,.95); color:var(--primary); padding:4px 12px 4px 8px; border-radius:999px; font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.08em; box-shadow:0 4px 12px rgba(0,0,0,.12); }
  .q-number{ font-size:12px; color:rgba(248,251,250,.7); font-weight:500; display:inline-flex; align-items:center; gap:4px; }
  /* 8pt: margin-bottom 8 */
  .q-title{ font-size:clamp(20px,2.4vw,30px); font-weight:600; color:var(--paper); line-height:1.28; margin-bottom:8px; letter-spacing:-.015em; text-shadow:0 2px 16px rgba(0,0,0,.25); }
  /* 8pt: margin-bottom 24 */
  .q-help{ font-size:13px; color:rgba(248,251,250,.78); margin-bottom:24px; line-height:1.55; }

  .q-input-wrap{ position:relative; }
  /* BUG FIX: font-size ≥16px prevents iOS auto-zoom on input focus */
  .q-input{ width:100%; background:transparent; border:none; border-bottom:2px solid rgba(248,251,250,.35); padding:12px 0; font-size:max(16px,clamp(16px,1.8vw,22px)); color:var(--paper); outline:none; font-family:inherit; -webkit-appearance:none; }
  .q-input::placeholder{ color:rgba(248,251,250,.45); font-weight:300; }
  .q-input-line{ position:absolute; bottom:0; left:0; height:2px; width:0; background:var(--paper); transition:width .35s var(--ease-out); pointer-events:none; }
  .q-input:focus+.q-input-line{ width:100%; }

  /* BUG FIX: font-size 16px, min-height 128px (16×8) */
  .q-textarea{ width:100%; background:rgba(255,255,255,.1); border:1.5px solid rgba(248,251,250,.25); padding:16px; font-size:16px; line-height:1.6; color:var(--paper); outline:none; border-radius:8px; resize:vertical; min-height:128px; transition:border-color .25s,background .25s; font-family:inherit; -webkit-appearance:none; }
  .q-textarea:focus{ border-color:var(--paper); background:rgba(255,255,255,.15); }
  .q-textarea::placeholder{ color:rgba(248,251,250,.45); }

  /* 8pt: gap 8 */
  .choices{ display:flex; flex-direction:column; gap:8px; margin-top:4px; }
  /* BUG FIX: removed translateX on mobile to prevent overflow; touch target padded to 44px min */
  .choice{ display:flex; align-items:center; gap:12px; background:rgba(255,255,255,.12); border:1.5px solid rgba(248,251,250,.25); padding:12px 16px; border-radius:8px; text-align:left; font-size:14px; color:var(--paper); transition:all .2s var(--ease-out); font-family:inherit; width:100%; min-height:44px; }
  @media(min-width:641px){
    .choice:hover{ border-color:var(--paper); transform:translateX(4px); background:rgba(255,255,255,.18); }
    .choice.selected{ transform:translateX(4px); }
  }
  @media(max-width:640px){
    .choice:hover{ border-color:var(--paper); background:rgba(255,255,255,.18); }
  }
  .choice.selected{ background:var(--paper); border-color:var(--paper); border-width:2px; color:var(--primary); }
  /* 8pt: 24×24 */
  .choice-key{ width:24px; height:24px; border:1.5px solid rgba(248,251,250,.4); border-radius:4px; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; background:rgba(255,255,255,.08); flex-shrink:0; transition:all .25s var(--ease-spring); }
  .choice.selected .choice-key{ background:var(--primary); color:var(--paper); border-color:var(--primary); }
  .choice-label{ flex:1; line-height:1.4; }
  /* 8pt: 20×20 (kept, closest to 24) */
  .choice-check{ width:20px; height:20px; border-radius:50%; background:var(--primary); color:var(--paper); display:flex; align-items:center; justify-content:center; font-size:10px; opacity:0; transition:opacity .3s var(--ease-spring); flex-shrink:0; }
  .choice.selected .choice-check{ opacity:1; }
  /* 8pt: margin-top 8 */
  .other-expand{ margin-top:8px; }

  /* 8pt: margin-top 24, gap 16 */
  .q-actions{ margin-top:24px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  /* 8pt: padding 12px 24px */
  .ok-btn{ background:var(--paper); color:var(--primary); border:none; padding:12px 24px; font-size:14px; font-weight:600; border-radius:8px; display:inline-flex; align-items:center; gap:8px; transition:all .2s var(--ease-out); box-shadow:0 8px 16px rgba(0,0,0,.2); font-family:inherit; min-height:44px; }
  .ok-btn:hover:not(:disabled){ transform:translateY(-1px); box-shadow:0 12px 24px rgba(0,0,0,.3); }
  .ok-btn:disabled{ background:rgba(255,255,255,.22); color:rgba(248,251,250,.45); box-shadow:none; cursor:not-allowed; }
  .enter-ic{ font-size:10px; opacity:.7; border:1px solid rgba(42,42,42,.3); border-radius:3px; padding:2px 4px; }
  .q-hint{ font-size:12px; color:rgba(248,251,250,.65); display:inline-flex; align-items:center; gap:8px; }
  .q-hint kbd{ background:rgba(255,255,255,.15); border:1px solid rgba(248,251,250,.3); border-radius:4px; padding:2px 6px; font-size:10px; font-family:inherit; }
  @media(max-width:640px){ .q-hint{ display:none; } }

  /* 8pt: padding 12px vertical, clamp 16→32 horizontal */
  .nav-footer{ padding:12px clamp(16px,4vw,32px); border-top:1px solid rgba(248,251,250,.1); display:flex; align-items:center; justify-content:space-between; flex-shrink:0; gap:8px; }
  .nav-arrows{ display:flex; gap:8px; }
  /* 8pt: 40×40 (min 44px touch) */
  .nav-arrow{ width:40px; height:40px; border:1.5px solid rgba(248,251,250,.3); border-radius:8px; background:rgba(255,255,255,.08); color:var(--paper); display:flex; align-items:center; justify-content:center; transition:all .2s; }
  .nav-arrow:hover:not(:disabled){ background:rgba(255,255,255,.18); border-color:rgba(248,251,250,.6); }
  .nav-arrow:disabled{ opacity:.3; cursor:not-allowed; }
  .nav-arrow svg{ width:14px; height:14px; }
  .nav-right{ font-size:12px; color:rgba(248,251,250,.6); display:flex; align-items:center; gap:8px; }
  .nav-right .num{ color:var(--paper); font-weight:600; }
  .divider{ width:1px; height:12px; background:rgba(248,251,250,.2); }
  /* 8pt: padding 6px 12px → 8px 12px */
  .guide-btn{ background:rgba(255,255,255,.1); border:1.5px solid rgba(248,251,250,.25); border-radius:6px; color:rgba(248,251,250,.85); padding:8px 12px; font-size:11px; font-weight:500; display:inline-flex; align-items:center; gap:6px; transition:all .2s; min-height:40px; }
  .guide-btn:hover{ background:rgba(255,255,255,.18); border-color:rgba(248,251,250,.5); }
  .guide-btn.active{ background:rgba(255,255,255,.2); border-color:var(--paper); color:var(--paper); }
  /* Hide guide label on small mobile, keep icon */
  @media(max-width:360px){ .guide-btn span{ display:none; } }

  /* ====== SIDEBAR ====== */
  /* 8pt: padding 16px 24px 16px */
  .sidebar-logo{ padding:16px 24px; border-bottom:1px solid rgba(231,231,231,.7); display:flex; flex-direction:column; gap:8px; }
  .sidebar-head{ display:flex; align-items:center; justify-content:space-between; }
  .sidebar-head-title{ font-size:15px; font-weight:600; }
  /* 8pt: 32×32 (plus visual centering) */
  .sidebar-close{ background:transparent; border:none; color:var(--neutral-900); opacity:.5; width:32px; height:32px; border-radius:50%; font-size:20px; display:flex; align-items:center; justify-content:center; transition:background .2s; }
  .sidebar-close:hover{ background:var(--neutral-200); opacity:1; }
  .back-intro-btn{ display:inline-flex; align-items:center; gap:6px; background:transparent; border:1px solid rgba(42,42,42,.18); color:var(--primary); padding:6px 10px; border-radius:999px; font-size:11px; font-weight:500; transition:all .2s; min-height:32px; }
  .back-intro-btn:hover{ background:var(--primary); color:var(--paper); border-color:var(--primary); transform:translateX(-2px); }
  /* 8pt: padding 16px 0 24px */
  .sidebar-nav{ flex:1; overflow-y:auto; padding:16px 0 24px; scrollbar-width:thin; }
  /* 8pt: margin-bottom 16 */
  .sidebar-section{ margin-bottom:16px; }
  /* 8pt: padding 0 24px 8px */
  .sidebar-section-title{ font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.1em; color:#a3a3a3; padding:0 24px 8px; display:flex; align-items:center; gap:8px; }
  /* 8pt: padding 8px 24px */
  .sidebar-q{ display:flex; align-items:center; gap:8px; padding:8px 24px; font-size:11.5px; color:#888; cursor:pointer; border-left:2px solid transparent; line-height:1.4; transition:color .2s,background .2s; min-height:40px; }
  .sidebar-q:hover{ background:#fbfbfb; color:var(--neutral-900); }
  .sidebar-q.active{ color:var(--primary); font-weight:500; border-left-color:var(--primary); background:linear-gradient(90deg,rgba(42,42,42,.05),transparent); }
  .sidebar-q.answered{ color:var(--neutral-900); }
  .sidebar-dot{ width:8px; height:8px; border-radius:50%; border:1.5px solid #d4d4d4; flex-shrink:0; background:transparent; transition:all .35s var(--ease-spring); }
  .sidebar-q.answered .sidebar-dot{ background:var(--primary); border-color:var(--primary); box-shadow:0 0 0 2px rgba(42,42,42,.1); }
  .sidebar-q.active .sidebar-dot{ border-color:var(--primary); border-width:2px; }
  .sidebar-q-text{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sidebar-q-num{ font-size:10px; color:#ccc; font-weight:500; }
  /* 8pt: padding 12px 24px 16px */
  .sidebar-foot{ padding:12px 24px 16px; border-top:1px solid rgba(231,231,231,.7); display:flex; align-items:center; justify-content:space-between; font-size:11px; color:#999; }
  .sidebar-foot .count{ color:var(--primary); font-weight:600; }

  /* ====== COMPLETE ====== */
  /* 8pt: padding 24px */
  .complete{ height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; background:linear-gradient(135deg,#2a2a2a 0%,#1f1f1f 100%); padding:24px; position:relative; overflow-y:auto; }
  /* 8pt: bottom 32px */
  .complete-logo{ position:absolute; bottom:32px; left:50%; transform:translateX(-50%); opacity:0.65; }
  .complete-inner{ text-align:center; max-width:456px; width:100%; animation:introIn .6s var(--ease-out); }
  /* 8pt: 56×56, margin-bottom 24 */
  .complete-check{ width:56px; height:56px; border-radius:50%; background:rgba(255,255,255,.12); border:2px solid rgba(248,251,250,.4); display:flex; align-items:center; justify-content:center; margin:0 auto 24px; }
  .complete-check svg{ width:24px; height:24px; stroke:var(--paper); stroke-width:2.5; fill:none; }
  .complete-title{ font-size:clamp(22px,3vw,32px); font-weight:600; color:var(--paper); letter-spacing:-.02em; margin-bottom:16px; }
  /* 8pt: margin-bottom 32 */
  .complete-sub{ font-size:14px; color:rgba(248,251,250,.72); line-height:1.65; margin-bottom:32px; }
  /* 8pt: gap 8 */
  .complete-actions{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  /* 8pt: padding 12px 24px */
  .complete-btn{ padding:12px 24px; border-radius:8px; font-size:14px; font-weight:600; display:inline-flex; align-items:center; gap:8px; transition:all .2s; font-family:inherit; min-height:48px; }
  .complete-btn.primary{ background:var(--paper); color:var(--primary); border:none; box-shadow:0 8px 16px rgba(0,0,0,.2); }

function isAnswered(q, v) {
  if (!v && v !== 0) return false;
  if (q.type==='short'||q.type==='long') return (v||'').trim().length > 0;
  if (q.type==='choice') { if(!v.selected) return false; if(v.selected==='Other'&&!(v.other||'').trim()) return false; return true; }
  if (q.type==='multi') { const s=v.selected||[]; if(!s.length) return false; if(s.includes('Other')&&!(v.other||'').trim()) return false; return true; }
  return false;
}

function isMobile() { return window.innerWidth < 641; }

}

function buildForm() {
  const q = ALL_Q[qIdx];

  const pct = Math.round(answeredCount()/total*100);

}

function buildInput(q) {
  const v = answers[q.id];
  if (q.type==='short') return `<div class="q-input-wrap"><input class="q-input" id="qInput" type="text" value="${escHtml(v||'')}" placeholder="${escHtml(q.placeholder||'Type your answer...')}" autocomplete="off"><span class="q-input-line"></span></div>`;
  if (q.type==='long') return `<textarea class="q-textarea" id="qInput" placeholder="${escHtml(q.placeholder||'Type your answer...')}">${escHtml(v||'')}</textarea>`;
  if (q.type==='choice'||q.type==='multi') {
    const multi = q.type==='multi';
    const sel = multi ? (v?.selected||[]) : (v?.selected||null);
    const ot = v?.other||'';
    let h = `<div class="choices">`;
    q.options.forEach((opt,i) => {
      const isSel = multi ? sel.includes(opt) : sel===opt;
      h += `<button class="choice${isSel?' selected':''}" data-opt="${escHtml(opt)}"><span class="choice-key">${String.fromCharCode(65+i)}</span><span class="choice-label">${escHtml(opt)}</span><span class="choice-check">✓</span></button>`;
    });
    h += `</div>`;
    const showOther = multi ? sel.includes('Other') : sel==='Other';
    if (showOther) h += `<div class="other-expand"><textarea class="q-textarea" id="otherInput" placeholder="Describe..." style="min-height:88px">${escHtml(ot)}</textarea></div>`;
    return h;
  }
  return '';
}

function buildResponses() {
  const total = ALL_Q.length, ac = answeredCount(), pct = Math.round(ac/total*100);
  let h = `<div class="responses"><div class="responses-header"><div>
    <h1 class="responses-title">Your answers</h1>
    <div class="responses-sub"><span><strong style="color:var(--primary)">${ac}</strong> of ${total} answered · ${pct}%</span>
    <div class="resp-progress-mini"><div class="resp-progress-mini-fill" style="width:${pct}%"></div></div></div>
  </div>
  <button class="export-btn" id="exportBtn"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12m0 0l-5-5m5 5l5-5M4 20h16"/></svg>Export</button>
  </div>`;
  SECTIONS.forEach((s,si) => {
    const sa = s.questions.filter(q=>isAnswered(q,answers[q.id])).length;
    h += `<div class="response-section"><div class="response-section-title"><span>${s.icon}</span><span>${s.title}</span><span class="num">${String(si+1).padStart(2,'0')}</span><span class="progress-mini">${sa}/${s.questions.length}</span></div>`;
    s.questions.forEach(q => {
      const v = answers[q.id], gi = ALL_Q.findIndex(qq=>qq.id===q.id)+1;
      let aHtml = !v||!isAnswered(q,v) ? `<div class="response-a empty">no answer</div>` :
        q.type==='multi'&&v.selected?.length>0 ? `<div class="response-a"><div class="resp-tags">${v.selected.map(o=>`<span class="resp-tag">${escHtml(o==='Other'?`Other: ${v.other}`:o)}</span>`).join('')}</div></div>` :
        `<div class="response-a">${escHtml(q.type==='choice'?v.selected==='Other'?`Other: ${v.other||''}`:v.selected:v||'')}</div>`;
      h += `<div class="response-item"><div class="response-q"><span class="qn">${String(gi).padStart(2,'0')}</span><span>${escHtml(q.title)}</span></div>${aHtml}</div>`;
    });
    h += `</div>`;
  });
  return h + `</div>`;
}

function buildSidebar() {
  const ac = answeredCount(), total = ALL_Q.length, curQ = ALL_Q[qIdx];
  let h = `<aside class="sidebar${sidebarOpen?' open':''}" id="sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-head"><span class="sidebar-head-title">Briefing</span><button class="sidebar-close" id="closeSidebar">×</button></div>
      ${phase!=='intro'?`<button class="back-intro-btn" id="backIntro"><svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>Back to intro</button>`:''}
    </div><nav class="sidebar-nav">`;
  SECTIONS.forEach((s,si) => {
    h += `<div class="sidebar-section"><div class="sidebar-section-title"><span>${s.icon}</span><span><span class="num">${String(si+1).padStart(2,'0')}</span> · ${s.title}</span></div>`;
    s.questions.forEach(q => {
      const answered = isAnswered(q,answers[q.id]), active = phase==='form'&&q.id===curQ?.id;
      const gi = ALL_Q.findIndex(qq=>qq.id===q.id)+1;
      h += `<div class="sidebar-q${answered?' answered':''}${active?' active':''}" data-qid="${q.id}"><span class="sidebar-dot"></span><span class="sidebar-q-text">${escHtml(q.title)}</span><span class="sidebar-q-num">${String(gi).padStart(2,'0')}</span></div>`;
    });
    h += `</div>`;
  });
  h += `</nav><div class="sidebar-foot"><span>Progress</span><span><span class="count">${ac}</span> / ${total}</span></div></aside>`;
  return h;
}

function escHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function toggleSidebar() { sidebarOpen = !sidebarOpen; render(); }
function goNext() { const q=ALL_Q[qIdx]; if(!isAnswered(q,answers[q.id])) return; if(qIdx<ALL_Q.length-1) qIdx++; else phase='complete'; render(); }
function goPrev() { if(qIdx>0){qIdx--;render();} }
function jumpTo(qid) { const i=ALL_Q.findIndex(q=>q.id===qid); if(i>=0){qIdx=i;phase='form';tab='form';if(isMobile())sidebarOpen=false;render();} }
function startBriefing(qid) { if(qid){const i=ALL_Q.findIndex(q=>q.id===qid);if(i>=0)qIdx=i;} phase='form';tab='form';render(); }
function exportText() {
  let t='BRIEFING — livia\n═══════════════════════════════════\n'+`Exported: ${new Date().toLocaleString('en-US')}\n\n`;
  SECTIONS.forEach((s,si)=>{
    t+=`\n${s.icon}  ${String(si+1).padStart(2,'0')}. ${s.title.toUpperCase()}\n───────────────────────────────────\n`;
    s.questions.forEach((q,qi)=>{
      t+=`\n${qi+1}. ${q.title}\n`;
      const v=answers[q.id]; let a='[no answer]';
      if(v&&isAnswered(q,v)){if(q.type==='short'||q.type==='long')a=v;else if(q.type==='choice')a=v.selected==='Other'?`Other: ${v.other||''}`:v.selected;else if(q.type==='multi')a=(v.selected||[]).map(o=>o==='Other'?`Other (${v.other||''})`:o).join(', ');}
      t+=`   → ${a}\n`;
    });
  });
  const b=new Blob([t],{type:'text/plain;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');
  a.href=u;a.download=`briefing-livia-${new Date().toISOString().slice(0,10)}.txt`;a.click();URL.revokeObjectURL(u);
}

function updateAnswer(qid, val) {
  answers[qid]=val;
  const q=ALL_Q.find(q=>q.id===qid), ans=isAnswered(q,val);
  const ok=document.getElementById('okBtn'), nx=document.getElementById('nextBtn');
  if(ok)ok.disabled=!ans; if(nx)nx.disabled=!ans;
  document.querySelectorAll(`[data-qid="${qid}"]`).forEach(el=>{if(ans)el.classList.add('answered');else el.classList.remove('answered');});
  const b=document.querySelector('.badge'); if(b)b.textContent=answeredCount();
}

function bindEvents() {
  const mbk=document.getElementById('mobBackdrop'); if(mbk)mbk.addEventListener('click',()=>{sidebarOpen=false;render();});
  ['toggleSidebar','toggleSidebarForm'].forEach(id=>{const el=document.getElementById(id);if(el)el.addEventListener('click',toggleSidebar);});
  const cl=document.getElementById('closeSidebar'); if(cl)cl.addEventListener('click',()=>{sidebarOpen=false;render();});
  const bk=document.getElementById('backIntro'); if(bk)bk.addEventListener('click',()=>{phase='intro';tab='form';sidebarOpen=false;render();});
  document.querySelectorAll('.sidebar-q[data-qid]').forEach(el=>el.addEventListener('click',()=>jumpTo(el.dataset.qid)));
  const tf=document.getElementById('tabForm'),tr=document.getElementById('tabResponses');
  if(tf)tf.addEventListener('click',()=>{tab='form';render();}); if(tr)tr.addEventListener('click',()=>{tab='responses';render();});
  ['startBriefing','startBriefing2'].forEach(id=>{const el=document.getElementById(id);if(el)el.addEventListener('click',()=>startBriefing());});
  document.querySelectorAll('[data-jump]').forEach(el=>el.addEventListener('click',()=>{const s=SECTIONS.find(s=>s.id===el.dataset.jump);if(s)startBriefing(s.questions[0].id);}));
  const ok=document.getElementById('okBtn'),pv=document.getElementById('prevBtn'),nx=document.getElementById('nextBtn');
  if(ok)ok.addEventListener('click',goNext); if(pv)pv.addEventListener('click',goPrev); if(nx)nx.addEventListener('click',goNext);
  const sa=document.getElementById('seeAnswers'),rs=document.getElementById('restartBtn');
  if(sa)sa.addEventListener('click',()=>{tab='responses';render();}); if(rs)rs.addEventListener('click',()=>{answers={};qIdx=0;phase='intro';tab='form';render();});
  const ex=document.getElementById('exportBtn'); if(ex)ex.addEventListener('click',exportText);

  const q=ALL_Q[qIdx];
  if(q&&phase==='form'){
    const inp=document.getElementById('qInput');
    if(inp){
      inp.addEventListener('input',()=>updateAnswer(q.id,inp.value));
      inp.addEventListener('keydown',e=>{if(q.type==='short'&&e.key==='Enter'){e.preventDefault();goNext();}if(q.type==='long'&&e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();goNext();}});
      setTimeout(()=>inp.focus(),50);
    }
    const oi=document.getElementById('otherInput');
    if(oi)oi.addEventListener('input',()=>{answers[q.id]={...(answers[q.id]||{}),other:oi.value};updateAnswer(q.id,answers[q.id]);});
    document.querySelectorAll('.choice[data-opt]').forEach(btn=>btn.addEventListener('click',()=>{
      const opt=btn.dataset.opt,multi=q.type==='multi',cur=answers[q.id]||{};
      if(multi){const sel=Array.isArray(cur.selected)?[...cur.selected]:[];const i=sel.indexOf(opt);if(i>=0)sel.splice(i,1);else sel.push(opt);answers[q.id]={selected:sel,other:sel.includes('Other')?cur.other:''};}
      else{answers[q.id]={selected:opt,other:opt==='Other'?cur.other:''};}
      updateAnswer(q.id,answers[q.id]);render();
      if(!multi&&opt!=='Other')setTimeout(()=>{if(isAnswered(q,answers[q.id]))goNext();},280);
    }));
    // Enter para avançar em choice/multi quando já respondido
    if(q.type==='choice'||q.type==='multi'){
      document.addEventListener('keydown',function onChoiceKey(e){
        if(e.key==='Enter'){
          e.preventDefault();
          if(isAnswered(q,answers[q.id]))goNext();
        }
      },{once:true});
    }
  }
  if(phase==='intro')document.addEventListener('keydown',function onK(e){if(e.key==='Enter'){e.preventDefault();startBriefing();}},{once:true});
}

render();
</script>
</body>
</html>
